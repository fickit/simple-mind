name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Compare the manifest version with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const manifest = require('./manifest.json'); const tag = process.env.TAG.replace(/^v/, ''); if (manifest.version !== tag) { throw new Error('manifest.json is ' + manifest.version + ' but the tag is ' + process.env.TAG); }"

      - name: Check the release bundle
        run: test -f main.js && test -f manifest.json && test -f styles.css

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md

      # A rolled-back tag leaves its release as a draft; free the tag name first.
      - name: Clear a leftover draft for this tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
            done

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "Simple Mind $GITHUB_REF_NAME" --notes-file release-notes.md
